version: '3.8'

services:
  relay:
    build: .
    container_name: relay-mvp
    ports:
      - "8000:8000"
    environment:
      - HERMES_HOME=${HOME}/.hermes
      - DEFAULT_MODEL=claude-opus-5
      - DEFAULT_REASONING=medium
      - MAX_TOKENS=4096
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ${HOME}/.hermes:${HOME}/.hermes:ro
      - /Volumes/Z\ Slim/relay-data/agents_db.json:/app/agents_db.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - relay-network

networks:
  relay-network:
    driver: bridge
